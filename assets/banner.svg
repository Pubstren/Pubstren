<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Pubstren — Quantitative Research · Data Infrastructure">
  <title>Pubstren</title>
  <desc>Quantitative Research · Data Infrastructure</desc>
  <style>
  .b {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: grow 8s cubic-bezier(.4,0,.25,1) infinite;
  }
  @keyframes grow {
    0%   { transform: scaleY(0); }
    10%  { transform: scaleY(1); }
    86%  { transform: scaleY(1); }
    100% { transform: scaleY(0); }
  }
  .sweep { animation: sw 9s linear 2.5s infinite; }
  @keyframes sw {
    from { transform: translateX(0); }
    to   { transform: translateX(1660px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .b, .sweep { animation: none; }
  }
</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#130F22"/>
      <stop offset="1" stop-color="#241A38"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="0" y1="195" x2="0" y2="310">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9B8FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C9B8FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#C9B8FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.2" fill="#2E2348"/>
    </pattern>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="330" rx="14"/>
    </clipPath>
  </defs>

